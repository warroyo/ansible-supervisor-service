apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awxconnections.field.vmware.com
spec:
  group: field.vmware.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                url:
                  type: string
                  description: base URL of the AWX/Tower instance, e.g. https://awx.example.com
                secretRef:
                  type: string
                  description: name of a Secret in this namespace holding the AWX API token in its "token" key
                insecureSkipVerify:
                  type: boolean
                  description: skip TLS certificate verification when calling the AWX API. mutually exclusive with caBundleSecretRef
                  default: false
                caBundleSecretRef:
                  type: object
                  description: Secret in this namespace holding a PEM CA bundle to trust when calling the AWX API, for an instance served by a private CA. the bundle is added to the system roots, not swapped for them
                  properties:
                    name:
                      type: string
                      description: name of the Secret. may be the same Secret as secretRef
                    key:
                      type: string
                      description: key within the Secret holding the PEM bundle
                      default: ca.crt
                  required:
                    - name
                apiBasePath:
                  type: string
                  description: overrides where this instance serves the controller API. leave empty to detect it - "/api/v2" on AWX, Ansible Tower and AAP up to 2.4, "/api/controller/v2" on AAP 2.5+ where the platform gateway moved the controller endpoints
                hostNamePrefix:
                  type: string
                  description: prepended to every AWX inventory host name created through this connection. AWX host names are unique per inventory, so a prefix keeps host entries apart when several supervisors or namespaces share one AWX instance
              required:
                - url
                - secretRef
            status:
              type: object
              description: current status of the AWXConnection
              properties:
                state:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                lastUpdated:
                  type: string
                  format: date-time
                apiBasePath:
                  type: string
                  description: the API root actually in use, detected on first validation or copied from spec.apiBasePath
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: State
          type: string
          jsonPath: .status.state
        - name: API
          type: string
          jsonPath: .status.apiBasePath
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: awxconnections
    singular: awxconnection
    kind: AWXConnection
    shortNames:
      - awxconn
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ansiblebindings.field.vmware.com
spec:
  group: field.vmware.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                vmSelector:
                  type: object
                  description: label selector (matchLabels-style) matching VirtualMachine resources in this namespace to target. must not be empty, an empty selector would target every VM in the namespace
                  minProperties: 1
                  additionalProperties:
                    type: string
                awxConnectionRef:
                  type: string
                  description: name of an AWXConnection in this namespace to launch templates through
                template:
                  type: object
                  description: the AWX job or workflow template to launch against each matched VM
                  properties:
                    name:
                      type: string
                      description: name of the job template or workflow job template in AWX
                    type:
                      type: string
                      description: which kind of AWX template "name" refers to
                      enum:
                        - JobTemplate
                        - WorkflowTemplate
                  required:
                    - name
                    - type
                hostName:
                  type: string
                  description: override the Ansible inventory host name (defaults to the VM's resource name)
                hostVariables:
                  type: object
                  description: extra host variables merged into the upserted inventory host, e.g. a custom ansible_host
                  additionalProperties:
                    type: string
                useDefaultLimit:
                  type: boolean
                  description: if true, launch without a --limit so the template's own configured limit/inventory applies; if false (default), scope the run to the provisioned host
                  default: false
                extraVars:
                  type: object
                  description: extra variables passed to the template launch
                  additionalProperties:
                    type: string
                cleanupPolicy:
                  type: string
                  description: whether the controller deletes AWX inventory hosts it created when a VM stops matching or the CR is deleted
                  enum:
                    - Delete
                    - Retain
                  default: Delete
                onDeleted:
                  type: object
                  description: playbook to run when a matched VirtualMachine is deleted, before its inventory host is removed. fires only for a VM that is really gone - one that merely stopped matching the selector is still running. the guest is already destroyed by then, so the playbook must act on the external record (DNS, IPAM, CMDB, monitoring) rather than on the machine
                  properties:
                    targeting:
                      type: string
                      description: what the hook is aimed at. ManagedHost, the default, supplies this VM's inventory host as the launch limit, which requires the template to share that inventory and to have Prompt on Launch enabled for Limit. Template supplies neither inventory nor limit and leaves the template's own targeting alone, for a decommissioning job or workflow that acts on records held elsewhere
                      enum:
                        - ManagedHost
                        - Template
                      default: ManagedHost
                    template:
                      type: object
                      description: the AWX job or workflow template to launch. under targeting ManagedHost it must have Prompt on Launch enabled for Limit, or the hook is refused rather than run against the whole inventory
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          enum:
                            - JobTemplate
                            - WorkflowTemplate
                      required:
                        - name
                        - type
                    timeoutSeconds:
                      type: integer
                      description: how long the whole hook may take - waiting for an in-flight provisioning job, launching, and polling to a terminal state. past it the finalizer is released anyway, so a playbook that hangs cannot hold a VM or a namespace in Terminating
                      minimum: 1
                      default: 900
                  required:
                    - template
              required:
                - vmSelector
                - awxConnectionRef
                - template
            status:
              type: object
              description: current status of the AnsibleBinding
              properties:
                state:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                lastUpdated:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  description: informational - the generation the controller most recently reconciled. relaunch decisions are made per VM, see each AnsibleBindingVM's status.appliedGeneration
                lastAppliedTrigger:
                  type: string
                  description: informational - the reconcile-requested-at annotation value the controller most recently saw. see each AnsibleBindingVM's status.appliedTrigger for what each VM actually ran
                lastOrphanScan:
                  type: string
                  format: date-time
                  description: when this binding last listed the AWX hosts it owns looking for ones no child claims. the scan costs an AWX request, so it runs on the controller's --host-check-period rather than every pass
                summary:
                  type: object
                  description: rollup of the AnsibleBindingVM children by phase. fixed size however many VMs the selector matches, so it stays writable at fleet scale
                  properties:
                    total:
                      type: integer
                    succeeded:
                      type: integer
                    running:
                      type: integer
                    pending:
                      type: integer
                    failed:
                      type: integer
                    failedVMs:
                      type: array
                      description: a bounded sample of the failing VMs, so "why is this binding red" is answerable without listing the children
                      items:
                        type: string
                    firstFailure:
                      type: string
                      description: the message from one of the failing children
                    terminating:
                      type: integer
                      description: children being deleted, counted apart from the phases above and not included in total. a child wedged in Terminating would otherwise drop out of the rollup entirely and leave the binding reading Ready
                    conflicted:
                      type: integer
                      description: selected VMs another binding already claims. part of total, and counted here rather than as pending because this binding is not waiting for them to start - it will not run them at all while someone else owns them
                    conflictedVMs:
                      type: array
                      description: a bounded sample of those VMs with the binding holding each claim, which is what an operator needs to resolve one
                      items:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: State
          type: string
          jsonPath: .status.state
        - name: VMs
          type: integer
          jsonPath: .status.summary.total
        - name: Failed
          type: integer
          jsonPath: .status.summary.failed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: ansiblebindings
    singular: ansiblebinding
    kind: AnsibleBinding
    shortNames:
      - ansbind
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ansiblebindingvms.field.vmware.com
spec:
  group: field.vmware.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: one VM's inventory host and run under an AnsibleBinding. created and deleted by the binding controller - not something to write by hand
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                # The object's name is the claim on a VirtualMachine, so
                # what it says it is a claim on cannot change under it.
                # Retarget by deleting this object, which runs its
                # cleanup, rather than by editing the identity out from
                # under a running job.
                - rule: self.vmName == oldSelf.vmName
                  message: spec.vmName identifies the claim and is immutable; delete this object instead
                - rule: self.bindingName == oldSelf.bindingName
                  message: spec.bindingName identifies the owning binding and is immutable; delete this object instead
                - rule: '!has(oldSelf.bindingUID) || (has(self.bindingUID) && self.bindingUID == oldSelf.bindingUID)'
                  message: spec.bindingUID identifies the owning binding incarnation and is immutable once set
              properties:
                vmName:
                  type: string
                  description: the VirtualMachine in this namespace this object tracks
                bindingName:
                  type: string
                  description: the AnsibleBinding that owns this child. the AWX host ownership marker is keyed to it, so hosts provisioned before the per-VM split are adopted unchanged
                bindingUID:
                  type: string
                  description: which incarnation of that binding owns it. a binding deleted and recreated under the same name is a different object and must claim its VMs rather than inherit live ones
                awxConnectionRef:
                  type: string
                  description: name of an AWXConnection in this namespace to launch through
                template:
                  type: object
                  description: the AWX job or workflow template to launch against this VM
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                      enum:
                        - JobTemplate
                        - WorkflowTemplate
                  required:
                    - name
                    - type
                hostName:
                  type: string
                  description: override the Ansible inventory host name (defaults to the VM's resource name)
                hostVariables:
                  type: object
                  description: extra host variables merged into the upserted inventory host
                  additionalProperties:
                    type: string
                useDefaultLimit:
                  type: boolean
                  description: if true, launch without a --limit so the template's own configured limit/inventory applies
                  default: false
                extraVars:
                  type: object
                  description: extra variables passed to the template launch
                  additionalProperties:
                    type: string
                cleanupPolicy:
                  type: string
                  description: whether the controller deletes the AWX inventory host it created when this object is deleted
                  enum:
                    - Delete
                    - Retain
                  default: Delete
                onDeleted:
                  type: object
                  description: playbook to run when a matched VirtualMachine is deleted, before its inventory host is removed. fires only for a VM that is really gone - one that merely stopped matching the selector is still running. the guest is already destroyed by then, so the playbook must act on the external record (DNS, IPAM, CMDB, monitoring) rather than on the machine
                  properties:
                    targeting:
                      type: string
                      description: what the hook is aimed at. ManagedHost, the default, supplies this VM's inventory host as the launch limit, which requires the template to share that inventory and to have Prompt on Launch enabled for Limit. Template supplies neither inventory nor limit and leaves the template's own targeting alone, for a decommissioning job or workflow that acts on records held elsewhere
                      enum:
                        - ManagedHost
                        - Template
                      default: ManagedHost
                    template:
                      type: object
                      description: the AWX job or workflow template to launch. under targeting ManagedHost it must have Prompt on Launch enabled for Limit, or the hook is refused rather than run against the whole inventory
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          enum:
                            - JobTemplate
                            - WorkflowTemplate
                      required:
                        - name
                        - type
                    timeoutSeconds:
                      type: integer
                      description: how long the whole hook may take - waiting for an in-flight provisioning job, launching, and polling to a terminal state. past it the finalizer is released anyway, so a playbook that hangs cannot hold a VM or a namespace in Terminating
                      minimum: 1
                      default: 900
                  required:
                    - template
                bindingGeneration:
                  type: integer
                  description: the binding's generation as of the last time the parent wrote this spec. compared against status.appliedGeneration to decide whether to relaunch
                bindingTrigger:
                  type: string
                  description: the binding's reconcile-requested-at value as of the last time the parent wrote this spec. compared against status.appliedTrigger to decide whether to relaunch
              required:
                - vmName
                - bindingName
                - awxConnectionRef
                - template
            status:
              type: object
              description: current status of this VM's inventory host and run
              properties:
                state:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                lastUpdated:
                  type: string
                  format: date-time
                observedIP:
                  type: string
                phase:
                  type: string
                  description: Pending, Running, Succeeded, or Failed
                awxHostID:
                  type: integer
                  description: AWX inventory host ID for this VM, used to target launches and to drive cleanup
                awxInventoryID:
                  type: integer
                  description: AWX inventory the host above lives in, tracked so repointing the template at another inventory moves the host instead of leaving it behind
                awxHostName:
                  type: string
                  description: inventory host name last used for this VM, tracked so a rename retires the old host instead of orphaning it
                awxHostCreated:
                  type: boolean
                  description: whether this controller owns the AWX host. ownership is stamped into the host description in AWX so it survives this resource being deleted and recreated. hosts that already existed unmarked are adopted and never deleted
                awxEndpoint:
                  type: string
                  description: fingerprint of the AWX instance the ids above came from. they are only meaningful there, so when the AWXConnection is repointed at another instance they are dropped rather than acted on
                lastHostCheck:
                  type: string
                  format: date-time
                  description: when this VM's inventory host was last reconciled against AWX itself. kept in status so the decision survives a controller restart. the period is the controller's --host-check-period
                deprovision:
                  type: object
                  description: how far the onDeleted hook has got. written during finalization so each pass resumes where the last one stopped rather than launching the playbook again
                  properties:
                    phase:
                      type: string
                      description: Launching, Running, Succeeded, Failed, TimedOut or Skipped. Failed, TimedOut and Skipped all still release the finalizer - a teardown playbook that cannot finish must not hold a namespace in Terminating
                    targeting:
                      type: string
                      enum:
                        - ManagedHost
                        - Template
                      description: the targeting this hook actually started under, stamped once so editing spec.onDeleted.targeting mid-teardown cannot change what a running hook is aimed at. absent on a hook started before this was recorded, which means ManagedHost
                    message:
                      type: string
                    startedAt:
                      type: string
                      format: date-time
                    deadline:
                      type: string
                      format: date-time
                      description: startedAt plus spec.onDeleted.timeoutSeconds, stamped once so editing the timeout mid-teardown cannot extend a hook already running
                    jobID:
                      type: integer
                    jobURL:
                      type: string
                    jobStatus:
                      type: string
                    jobType:
                      type: string
                      enum: [JobTemplate, WorkflowTemplate]
                    endpoint:
                      type: string
                      description: fingerprint of the AWX instance the hook's job was launched on. a poll checks it so a repointed AWXConnection cannot make it follow the same job number to an unrelated job on another instance
                    launchError:
                      type: string
                      description: what AWX said it ignored about the launch. a job launched with its limit dropped is not running against this host, so the hook cannot report success however well the job itself ran
                    hostPinned:
                      type: boolean
                      description: whether the hook set ansible_connection on a host that will outlive it (cleanupPolicy Retain, or an adopted host), so the override can be taken back off before the finalizer is released
                    priorConnection:
                      type: string
                      description: what ansible_connection said on that host before the hook pinned it. absent means it was not set at all, which restores differently from an explicit value
                    pinnedHostID:
                      type: integer
                      description: id of the host the override was written to. the restore is refused on any other host, so a host deleted and recreated under the same name during the hook is left alone rather than given a variable nothing set on it
                    pinnedHostEndpoint:
                      type: string
                      description: fingerprint of the AWX instance that host is on, so a repointed AWXConnection cannot make the restore act on a same-named host elsewhere
                appliedGeneration:
                  type: integer
                  description: spec.bindingGeneration this VM last launched a run for
                appliedTrigger:
                  type: string
                  description: spec.bindingTrigger this VM last launched a run for
                lastJobID:
                  type: integer
                lastJobURL:
                  type: string
                lastJobStatus:
                  type: string
                lastJobType:
                  type: string
                  enum: [JobTemplate, WorkflowTemplate]
                  description: template type used to launch lastJobID, unaffected by subsequent spec changes
                lastJobConnection:
                  type: object
                  description: connection settings used at launch, including the resolved API path and Secret references but never Secret contents
                  properties:
                    url:
                      type: string
                    secretRef:
                      type: string
                    apiBasePath:
                      type: string
                    insecureSkipVerify:
                      type: boolean
                    caBundleSecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                      required: [name]
                    hostNamePrefix:
                      type: string
                  required: [url, secretRef, apiBasePath]
                history:
                  type: array
                  description: bounded log of recent runs for this VM, most recent first
                  items:
                    type: object
                    properties:
                      jobID:
                        type: integer
                      status:
                        type: string
                      startedAt:
                        type: string
                        format: date-time
                      finishedAt:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: VM
          type: string
          jsonPath: .spec.vmName
        - name: Binding
          type: string
          jsonPath: .spec.bindingName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Job
          type: integer
          jsonPath: .status.lastJobID
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: ansiblebindingvms
    singular: ansiblebindingvm
    kind: AnsibleBindingVM
    shortNames:
      - ansbindvm
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ansibleruns.field.vmware.com
spec:
  group: field.vmware.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          # spec is required so its immutability rule is always evaluated.
          # A transition rule on an optional field is skipped when that
          # field is added or removed, so an optional spec could be
          # dropped in one update and reintroduced with different
          # contents in the next - launching a second execution from a
          # resource whose spec is documented as immutable.
          required:
            - spec
          properties:
            spec:
              type: object
              description: a single execution - one AWX job, launched once, terminal forever. re-running means creating another AnsibleRun
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: spec is immutable - an AnsibleRun executes once; create a new one to run again
                - rule: "!(has(self.hosts) && has(self.vmRef))"
                  message: spec.hosts and spec.vmRef are mutually exclusive - a run points at explicit hosts or at one VM, not both
              properties:
                awxConnectionRef:
                  type: string
                  description: name of an AWXConnection in this namespace to launch the template through
                template:
                  type: object
                  description: the AWX job or workflow template to launch, once
                  properties:
                    name:
                      type: string
                      description: name of the job template or workflow job template in AWX
                    type:
                      type: string
                      description: which kind of AWX template "name" refers to
                      enum:
                        - JobTemplate
                        - WorkflowTemplate
                  required:
                    - name
                    - type
                vmRef:
                  type: object
                  description: target one VirtualMachine in this namespace - an inventory host is built from its reported IP and the run is scoped to it. mutually exclusive with hosts. reading a VM's fields into playbook variables is varsFrom's job, not this one
                  properties:
                    name:
                      type: string
                      description: name of a VirtualMachine in this namespace
                  required:
                    - name
                hostName:
                  type: string
                  description: override the inventory host name derived from vmRef (defaults to the VM's resource name)
                hostVariables:
                  type: object
                  description: extra host variables merged into the host derived from vmRef, e.g. a custom ansible_host
                  additionalProperties:
                    type: string
                hosts:
                  type: array
                  description: explicit inventory targets, for hosts this Supervisor does not own. names are literals and the AWXConnection's hostNamePrefix is deliberately not applied to them, since they commonly name hosts that already exist in the inventory. mutually exclusive with vmRef
                  minItems: 1
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: the AWX inventory host name, used verbatim
                      address:
                        type: string
                        description: sets ansible_host. omit to leave ansible_host unmanaged, which is what a host already in the inventory with working connection details needs
                      variables:
                        type: object
                        description: host variables merged into this host
                        additionalProperties:
                          type: string
                    required:
                      - name
                extraVars:
                  type: object
                  description: extra variables passed to the template launch
                  additionalProperties:
                    type: string
                varsFrom:
                  type: array
                  description: extra variables read off live objects in this namespace, for a playbook that acts on a resource's behalf rather than logging into it - a hosts:localhost DNS or CMDB playbook needing a VM's name and IP as variables
                  minItems: 1
                  items:
                    type: object
                    properties:
                      resource:
                        type: object
                        description: the object to read. always in this AnsibleRun's own namespace - there is deliberately no namespace field, since a cross-namespace read would let a tenant pull data out of a neighbour. Secrets are refused, because extra variables are visible in AWX job output
                        properties:
                          apiVersion:
                            type: string
                          kind:
                            type: string
                          name:
                            type: string
                        required:
                          - apiVersion
                          - kind
                          - name
                      vars:
                        type: object
                        description: >-
                          maps an extra variable name to a JSONPath evaluated against the object,
                          e.g. record_ip -> "{.status.network.primaryIP4}". must resolve to a scalar
                        minProperties: 1
                        additionalProperties:
                          type: string
                    required:
                      - resource
                      - vars
                cleanupPolicy:
                  type: string
                  description: whether AWX inventory hosts this run created are deleted along with it. hosts that already existed are adopted and never deleted regardless
                  enum:
                    - Delete
                    - Retain
                  default: Delete
                activeDeadlineSeconds:
                  type: integer
                  minimum: 0
                  description: bound the whole run, measured from creation. on expiry it goes terminally Failed, which is what stops a retryable condition - a referenced object that never appears, an AWX job wedged non-terminal - from waiting forever. 0 or unset means no deadline
                ttlSecondsAfterFinished:
                  type: integer
                  minimum: 0
                  description: delete this resource that long after it reaches a terminal state, taking the AWX hosts it created with it. unset keeps it indefinitely. granularity is the controller's resync period
              required:
                - awxConnectionRef
                - template
            status:
              type: object
              description: current status of the AnsibleRun
              properties:
                state:
                  type: string
                  description: Pending, Running, Ready, or Failed
                message:
                  type: string
                ready:
                  type: boolean
                lastUpdated:
                  type: string
                  format: date-time
                jobID:
                  type: integer
                  description: the one AWX job this run launched
                jobURL:
                  type: string
                  description: link to the run's output in the AWX UI
                jobStatus:
                  type: string
                  description: AWX's own status vocabulary for the job, e.g. pending, running, successful, failed
                startedAt:
                  type: string
                  format: date-time
                finishedAt:
                  type: string
                  format: date-time
                  description: set only on a terminal outcome, and what ttlSecondsAfterFinished counts from. a retryable failure leaves it empty on purpose
                launchAttemptedAt:
                  type: string
                  format: date-time
                  description: written before the launch request goes out. set with no jobID means the launch's outcome was never recorded, and the controller looks the job up in AWX and adopts it rather than launching a second one
                cancelRequestedAt:
                  type: string
                  format: date-time
                  description: when AWX accepted a request to cancel this run's job. AWX answers a cancel with 202 Accepted, so this records that cancellation was asked for, not that the job has stopped - finalization waits for a terminal jobStatus before deleting the hosts that job may still be running against
                awxEndpoint:
                  type: string
                  description: fingerprint of the AWX instance every id in this status was issued by. an id means nothing on another instance, so a connection repointed elsewhere stops the run rather than polling, canceling or deleting whatever holds those ids there
                failureReason:
                  type: string
                  description: why a terminal failure happened, kept here because status.message is rewritten from scratch on every pass
                resolvedVars:
                  type: array
                  description: the extra variable names varsFrom produced. names only - values are never echoed into status
                  items:
                    type: string
                hosts:
                  type: array
                  description: the AWX inventory hosts this run touched
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      address:
                        type: string
                      awxHostID:
                        type: integer
                      awxInventoryID:
                        type: integer
                      awxHostCreated:
                        type: boolean
                        description: whether this run created the host. hosts that already existed are adopted and never deleted
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: State
          type: string
          jsonPath: .status.state
        - name: Job
          type: integer
          jsonPath: .status.jobID
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: ansibleruns
    singular: ansiblerun
    kind: AnsibleRun
    shortNames:
      - ansrun
