# A deliberately simplified stand-in for vmoperator.vmware.com's real
# VirtualMachine CRD, used only by test/e2e.sh against a local kind
# cluster. It carries just the fields the controller reads
# (status.powerState, status.network.primaryIP4) plus enough of the real
# shape (group/version/kind, labels) to exercise vmSelector matching. It
# deliberately has NO status subresource, so the e2e fixtures can set
# status directly via `kubectl apply` in one shot - real VM Service VMs
# do have a status subresource; only a live Supervisor with vm-operator
# installed exercises that path.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachines.vmoperator.vmware.com
spec:
  group: vmoperator.vmware.com
  versions:
    - name: v1alpha2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
  scope: Namespaced
  names:
    plural: virtualmachines
    singular: virtualmachine
    kind: VirtualMachine
    shortNames:
      - vm
