name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


jobs:
  build-and-release:
    # Least privilege: the job pushes an image to GHCR and creates a
    # release. It has no business writing issues, pages or actions.
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Carvel Tools
        run: |
          set -euo pipefail
          install_carvel() {  # install_carvel <name> <repo> <version> <sha256>
            curl -sSLo "/tmp/$1" "https://github.com/$2/releases/download/$3/$1-linux-amd64"
            echo "$4  /tmp/$1" | sha256sum -c -
            chmod +x "/tmp/$1" && sudo mv "/tmp/$1" /usr/local/bin/
          }
          install_carvel ytt carvel-dev/ytt v0.55.1 3a2c925ed222f8db4956946d40279688edd6ceb3e919f03f919a8fc8b8532eda
          install_carvel imgpkg carvel-dev/imgpkg v0.48.1 6c7a1a2e6555e7827c3c97580be87c84d06778d0650d308f7dc67613aec7c7c8
          install_carvel kctrl carvel-dev/kapp-controller v0.60.6 0b6451e64055a2203e72bd1175892db8e17b23dc3e23edd7d60ebe42b063c036
          # `kctrl package release` shells out to the whole fetch/template
          # chain - vendir, then ytt, then kbld - and fails with "executable
          # file not found" on whichever one is missing.
          install_carvel vendir carvel-dev/vendir v0.45.2 ecd053b031fdebfe0486b263a7071320b033f60b6d9e6c6b74ad681f2d7068b5
          install_carvel kbld carvel-dev/kbld v0.47.1 0950151615895b6a699085ba216a321aec35e4808672277281b94fc58cc0686b
          kctrl version

      - name: Set Version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
          fi

      - name: Build Controller
        run: make build-controller

      - name: Release Controller
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release-controller

      - name: Release Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ansible-supervisor.yml
          generate_release_notes: true
