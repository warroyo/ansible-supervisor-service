name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Unit tests
        run: make test-unit

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Install kind
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/
          kind version

      - name: Install Carvel Tools
        run: |
          set -euo pipefail
          install_carvel() {  # install_carvel <name> <repo> <version> <sha256>
            curl -sSLo "/tmp/$1" "https://github.com/$2/releases/download/$3/$1-linux-amd64"
            echo "$4  /tmp/$1" | sha256sum -c -
            chmod +x "/tmp/$1" && sudo mv "/tmp/$1" /usr/local/bin/
          }
          install_carvel ytt carvel-dev/ytt v0.55.1 3a2c925ed222f8db4956946d40279688edd6ceb3e919f03f919a8fc8b8532eda
          ytt version

      - name: E2E tests
        run: make test-e2e
