#@ load("@ytt:data", "data")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-supervisor-controller
  namespace: #@ data.values.namespace
spec:
  replicas: 1
  #! Recreate, not RollingUpdate: two controllers reconciling the same
  #! AnsibleBindings would each decide independently to launch a run, so
  #! an upgrade must never overlap old and new pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ansible-supervisor
  template:
    metadata:
      labels:
        app: ansible-supervisor
    spec:
      serviceAccountName: ansible-supervisor
      #! The controller drains its workqueue on SIGTERM; this is the
      #! window it gets to finish the reconcile in hand.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: controller
        args:
        - #@ "--resync-period=" + data.values.resync_period
        - #@ "--reconcile-timeout=" + data.values.reconcile_timeout
        - #@ "--supervisor-id=" + data.values.supervisor_id
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          #! No CPU limit: throttling a controller just makes reconciles
          #! late. Memory is capped because a runaway is worth killing.
          limits:
            memory: 256Mi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ansible-supervisor
  namespace: #@ data.values.namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ansible-supervisor
rules:
  #! get only, deliberately: the controller only ever reads the specific Secret
  #! an AWXConnection names. list/watch here would let it enumerate every
  #! Secret of every tenant on the supervisor.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  #! read-only, and only to derive a stable supervisor identity from the
  #! kube-system namespace UID when supervisor_id is not set explicitly.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: ["vmoperator.vmware.com"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch"]
  #! API discovery, read at startup to find which VirtualMachine version
  #! this supervisor serves rather than compiling one in. Stock clusters
  #! already grant this to system:authenticated via system:discovery;
  #! spelled out so the controller doesn't silently fall back to a pinned
  #! version on a supervisor that doesn't. Discovery exposes only the
  #! names of API groups and resources, no object data.
  - nonResourceURLs: ["/apis", "/apis/*"]
    verbs: ["get"]
  - apiGroups: ["field.vmware.com"]
    resources:
      - awxconnections
      - ansiblebindings
      - awxconnections/status
      - ansiblebindings/status
      - ansiblebindingvms/status
    verbs: ["get", "list", "watch", "update", "patch"]
  #! An AnsibleBinding creates and deletes one AnsibleBindingVM per matched
  #! VM, so this kind alone needs create and delete. Kept as its own rule
  #! rather than widening the verbs above, which would also let the
  #! controller create and delete the user's bindings and connections.
  - apiGroups: ["field.vmware.com"]
    resources: ["ansiblebindingvms"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ansible-supervisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ansible-supervisor
subjects:
  - kind: ServiceAccount
    name: ansible-supervisor
    namespace: #@ data.values.namespace
---
#! Both CRDs are namespace-scoped and tenant-owned - a tenant with edit/admin
#! on their namespace can manage their own AWXConnections and
#! AnsibleBindings without any extra grant. Unlike a cross-namespace
#! credential-sharing CRD, there's no separate "authority" concept needed here:
#! an AWXConnection's Secret never leaves the namespace it's created in.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aggregate-ansible-supervisor-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
- apiGroups: ["field.vmware.com"]
  resources: ["awxconnections", "ansiblebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
#! Children are created by the controller, not by users. Readable so a
#! tenant can see why one VM under a binding is failing, but not writable:
#! editing one would be undone on the binding's next pass.
- apiGroups: ["field.vmware.com"]
  resources: ["ansiblebindingvms"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aggregate-ansible-supervisor-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
- apiGroups: ["field.vmware.com"]
  resources: ["awxconnections", "ansiblebindings", "ansiblebindingvms"]
  verbs: ["get", "list", "watch"]
